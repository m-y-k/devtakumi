services:
  mysql:
    image: mysql:8.0
    container_name: devtakumi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devtakumi
      MYSQL_USER: devtakumi
      MYSQL_PASSWORD: devtakumipassword
    ports:
      - "3306:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0:
    image: judge0/judge0:1.13.1
    container_name: devtakumi-judge0
    restart: unless-stopped
    ports:
      - "2358:2358"
    volumes:
      - judge0_data:/judge0
    privileged: true
    environment:
      JUDGE0_ALLOW_CPU_TIME_LIMIT_OVERRIDE: "true"
      JUDGE0_ALLOW_MEMORY_LIMIT_OVERRIDE: "true"
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:16
    container_name: devtakumi-judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7
    container_name: devtakumi-judge0-redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtakumi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/devtakumi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: devtakumi
      SPRING_DATASOURCE_PASSWORD: devtakumipassword
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment (.env) — openssl rand -hex 48}
      JUDGE0_URL: http://judge0:2358
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in the environment (.env)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the environment (.env)}
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  judge0_data:
  judge0_db_data:
  storage_data:
