<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/devtakumi-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b13" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('devtakumi-theme')
          var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches
          if (!dark) document.documentElement.classList.add('light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = dark ? '#070b13' : '#f4f6fb'
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="devtakumi — a coding bootcamp taught by Flipkart SDEs. One robust roadmap from your first array to full production systems."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>devtakumi — Learn to Code, Build Careers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
